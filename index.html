<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link href='https://fonts.googleapis.com/css?family=Cinzel+Decorative' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
  <script>
    document.addEventListener("mousemove", (e) => {
      document.querySelectorAll(".shape").forEach((shape, idx) => {
        const speed = (idx + 1) * 0.02;
        const x = (window.innerWidth - e.pageX * speed) / 90;
        const y = (window.innerHeight - e.pageY * speed) / 90;
        shape.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</head>
<body>
  <header>
    <nav>
      <div class="nav-container">
      <img src="personalLogo_Cream.png" alt="Hailey Newill Personal Logo" class="logo">
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    </nav>
  </header>

<!-- COVER PAGE SECTION -->
  <section class="cover">
    <div class="gradient-orbs"></div>

    <div class="cover-content">
      <h1 class="big-title">HAILEY NEWILL</h1>
      <p class="tagline">Designer • Illustrator • Developer</p>

      <a href="portfolio.html" class="enter-btn">Enter Portfolio</a>
    </div>

    <!-- Floating animated shapes -->
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Hailey Newill. All Rights Reserved.</p>
  </footer>
</body>
  
</html>
