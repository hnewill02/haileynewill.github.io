<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link href='https://fonts.googleapis.com/css?family=Cinzel+Decorative' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
  <script>
    document.addEventListener("mousemove", (e) => {
      document.querySelectorAll(".shape").forEach((shape, idx) => {
        const speed = (idx + 1) * 0.02;
        const x = (window.innerWidth - e.pageX * speed) / 90;
        const y = (window.innerHeight - e.pageY * speed) / 90;
        shape.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</head>
<body>
  <header>
    <nav>
      <div class="nav-container">
      <img src="personalLogo_Cream.png" alt="Hailey Newill Personal Logo" class="logo">
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    </nav>
  </header>

<!-- COVER PAGE SECTION -->
  <section class="cover">
    <div class="particles"></div>
    <div class="fantasy-nebula"></div>
    <div class="leaves"></div>

    <div class="cover-content">
      <h1 class="big-title">HAILEY NEWILL</h1>
      <p class="tagline">Designer • Illustrator • Developer</p>

      <a href="portfolio.html" class="enter-btn">Enter Portfolio</a>
    </div>
  </section>

<!-- GALLERY TEASAER SEACATION -->
  <section class="gallery-teaser">
  <h2 class="gallery-title">Featured Work</h2>
  <div class="carousel-container">
    <div class="carousel-track">
      <img src="AAT_Logo.png" alt="Gallery Image 1">
      <img src="COTGboxdesign.jpg" alt="Gallery Image 2">
      <img src="Costume_Ortho_Color.png" alt="Gallery Image 3">
      <img src="Hera_2.0.png" alt="Gallery Image 4">
      <img src="RaptorStampsIllustration.png" alt="Gallery Image 5">
      <img src="SrPoster_Jessen.png" alt="Gallery Image 6">
      <img src="productphoto1.png" alt="Gallery Image 7">
      <img src="HomecomingKickoff.png" alt="Gallery Image 8">
    </div>
  </div>
  <a href="portfolio.html" class="gallery-btn">View Full Portfolio</a>
</section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Hailey Newill. All Rights Reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.querySelector(".leaves");
      for (let i = 0; i < 12; i++) {
        const leaf = document.createElement("div");
        leaf.classList.add("leaf");
        leaf.style.left = Math.random() * 100 + "%";
        leaf.style.animationDelay = Math.random() * 10 + "s";
        leaf.style.opacity = 0.3 + Math.random() * 0.4;
        leaf.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
        container.appendChild(leaf);
      }
    });
    
    const track = document.querySelector(".carousel-track");
    const firstImage = track.children[0].cloneNode(true);
    track.appendChild(firstImage);
    
  </script>
    
</body>
  
</html>
